model: medium
language: zh
device: auto
compute_type: auto
traditional_chinese: true
beam_size: 5
vad_filter: true
vad_parameters:
  min_silence_duration_ms: 500
  speech_pad_ms: 400
  threshold: 0.5

# 每次僅解碼 5 分鐘；接續或恢復時重疊 15 秒。
chunk_seconds: 300
overlap_seconds: 15
cpu_threads: 0
offline: false

# 可在 UI 勾選；0 代表自動估計人數，亦可指定 1–20。
diarize: false
num_speakers: 0
speaker_threshold: 0.45

output:
  txt: true
  timestamp_txt: true
  srt: true
  json: true
  markdown: true

input_dir: input
output_dir: output
models_dir: models
logs_dir: logs
# 留空時依序找 PATH、imageio-ffmpeg 隨附的執行檔。
ffmpeg_path: null

initial_prompt: >
  這是一段台灣電子製造業的中文會議錄音，討論工單、物料、機台和資訊系統。
# 只填本次錄音可能出現的字詞，過多無關詞可能降低辨識品質。
hotwords: ""
# 預設關閉，以免長句或靜音時產生重複、幻覺。
condition_on_previous_text: false

terminology:
  iQube: iCube
  IQube: iCube
  icube: iCube
  "i cube": iCube
  "iq cube": iCube
  waffer: Wafer
  wafer: Wafer
  waffle: Waffle
  "bar code": Barcode
  barcode: Barcode
  pcb: PCB
  erp: ERP
  smt: SMT
